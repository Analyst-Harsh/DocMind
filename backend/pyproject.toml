[project]
name = "backend"
version = "0.1.0"
description = "Backend fast api for doc mind"
readme = "README.md"
requires-python = ">=3.13"


dependencies = [
    "docling>=2.110.0",
    "fastapi>=0.137.0",
    "fastembed>=0.4.0,<1.0",
    "fastmcp>=3.4,<4",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "langfuse>=4.9.0",
    "neo4j>=6.2.0",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "rapidfuzz>=3.9.0",
    "redis>=8.0.1",
    "rich>=13.7.0",
    "sentence-transformers>=3.0.0",
    "structlog>=26.1.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]

[tool.uv]
constraint-dependencies = ["langchain-community<0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line-length handled by formatter, not worth failing CI over
]

[tool.ruff.lint.per-file-ignores]
"app/**/test/*.py" = ["F401"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "types-pyyaml>=6.0.12.20260518",
]
