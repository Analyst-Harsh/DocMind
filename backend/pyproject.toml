[project]
name = "backend"
version = "0.1.0"
description = "Backend fast api for doc mind"
readme = "README.md"
requires-python = ">=3.13"


dependencies = [
    "fastapi>=0.137.0",
    "jinja2>=3.1.6",
    "langfuse>=4.9.0",
    "openai>=2.41.1",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "types-pyyaml>=6.0.12.20260518",
]
